name: Fetch Vosk Spanish Model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download Spanish Vosk model
        run: |
          curl --fail --location --retry 3 \
            --output vosk-model-small-es-0.42.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          test -s vosk-model-small-es-0.42.zip
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: vosk-model-small-es-0.42
          path: vosk-model-small-es-0.42.zip
          retention-days: 1
