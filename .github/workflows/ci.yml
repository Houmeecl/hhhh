name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend — instalar y test
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Portable — instalar y test
        working-directory: portable
        run: |
          npm ci
          npm test

      - name: Frontend — instalar y build
        working-directory: frontend
        run: |
          npm ci
          npm run build
